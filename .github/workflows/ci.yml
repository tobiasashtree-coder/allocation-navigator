name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: uv sync --all-groups
      - name: Ruff (Lint)
        run: uv run ruff check .
      - name: Ruff (Format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests (ohne Live-Daten)
        run: uv run pytest -m "not live"
      - name: CLI-Rauchtest
        run: uv run navigator --help
