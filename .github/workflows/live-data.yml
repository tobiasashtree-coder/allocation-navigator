name: Live-Daten (manuell)

# Ruft die echten Datenquellen ab und erzeugt den Validierungsbericht (Pruefpunkt M1).
# Start: GitHub -> Actions -> "Live-Daten (manuell)" -> Run workflow.
# Benoetigt die Repository-Secrets FRED_API_KEY und (optional) TIINGO_API_KEY.

on:
  workflow_dispatch:
    inputs:
      base_currency:
        description: "Basiswaehrung fuer den Bericht (leer = alle unterstuetzten)"
        required: false
        default: ""
      backtest:
        description: "Backtest ausfuehren (ja/nein, dauert rund 30 Minuten)"
        required: false
        default: "ja"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Datencache wiederherstellen
        uses: actions/cache@v4
        with:
          path: data
          key: live-data-${{ github.run_id }}
          restore-keys: live-data-
      - name: Quellen pruefen (Ticker, Reihen-IDs, Startdaten)
        run: uv run navigator data sources --probe | tee sources.log
        continue-on-error: true
      - name: Monatslauf (Datenabruf, Validierung, Regime, Schuldenzyklus, Empfehlung, Bericht)
        run: uv run navigator monthly | tee monthly.log
        continue-on-error: true
      - name: Backtest
        if: ${{ inputs.backtest != 'nein' }}
        run: uv run navigator backtest | tee backtest.log
        continue-on-error: true
      - name: Bericht in die Zusammenfassung schreiben
        if: always()
        shell: bash
        run: |
          for f in reports/monthly_latest.md reports/backtest_latest.md reports/recommend_latest.md reports/debt_latest.md reports/regime_b_latest.md reports/regime_a_latest.md reports/validation_latest.md reports/sources_latest.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo "::group::$f"; cat "$f"; echo "::endgroup::"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-daten-bericht
          path: |
            reports/
            *.log
            data/runs/
