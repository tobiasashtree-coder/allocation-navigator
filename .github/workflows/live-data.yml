name: Live-Daten (manuell)

# Ruft die echten Datenquellen ab und erzeugt den Validierungsbericht (Pruefpunkt M1).
# Start: GitHub -> Actions -> "Live-Daten (manuell)" -> Run workflow.
# Benoetigt die Repository-Secrets FRED_API_KEY und (optional) TIINGO_API_KEY.

on:
  workflow_dispatch:
    inputs:
      base_currency:
        description: "Basiswaehrung fuer den Bericht (leer = alle unterstuetzten)"
        required: false
        default: ""

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Quellen pruefen (Ticker, Reihen-IDs, Startdaten)
        run: uv run navigator data sources --probe | tee sources.log
        continue-on-error: true
      - name: Daten abrufen
        run: uv run navigator data update | tee update.log
        continue-on-error: true
      - name: Validieren
        run: uv run navigator data validate | tee validate.log
        continue-on-error: true
      - name: Statische Datensätze ansehen (Diagnose)
        run: |
          for d in lw_realtime hlw_current; do
            echo "### $d"; uv run navigator data inspect "$d" --rows 16 || true
          done | tee inspect.log
        continue-on-error: true
      - name: Bericht in die Zusammenfassung schreiben
        if: always()
        shell: bash
        run: |
          for f in reports/validation_latest.md reports/sources_latest.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo "::group::$f"; cat "$f"; echo "::endgroup::"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-daten-bericht
          path: |
            reports/
            *.log
            data/runs/
