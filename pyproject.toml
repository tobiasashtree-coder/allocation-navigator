[project]
name = "allocation-navigator"
version = "0.1.0"
description = "Strategischer Asset-Allocation-Navigator nach Dalio-Zyklen (Regime-Erkennung, Schuldenzyklus-Overlay, Empfehlungen, Backtest)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary - private Nutzung" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yfinance>=0.2.54",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
navigator = "navigator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "live: Tests gegen echte Datenquellen (brauchen Netz und API-Keys; nicht in der Standard-CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Sonderzeichen in Texten erlaubt

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E501"]  # Testdaten dürfen lange Zeilen haben

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["navigator"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
