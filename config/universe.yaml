        quality: synthetisch
        backfill: true
        currency: EUR
        expected_start: "1972-09"
        maturity_years: 2.0
        yield_symbols:
          bundesbank: "BBSIS/M.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A"
        note: Bundesbank-Zinsstruktur (Monatsendstände), Restlaufzeit 2 Jahre.

  bond_eur_long:
