        yield_symbols:
          bundesbank: "BBSIS/M.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A"
          oecd: "OECD.SDD.STES,DSD_STES@DF_FINMARK,4.0/DEU.M.IRLT.PA._Z._Z._Z._Z.N"
          fred: IRLTLT01DEM156N
        note: Bundesbank ab 1972 (Monatsende); OECD/FRED ab 1956 (Monatsdurchschnitt) als Ersatz.

  bond_us_long:
