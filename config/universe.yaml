# Anlageuniversum: 18 Assetklassen in fünf Gruppen (Spezifikation Abschnitt 2).
#
# Je Klasse eine Liste von Segmenten, das bevorzugte (jüngste) zuerst. Frühere
# Zeiträume füllt das jeweils nächste Segment (Backfill). Die Naht bestimmt sich
# aus den tatsächlich vorhandenen Daten, nicht aus `expected_start`; weicht der
# echte Start stark ab, meldet das der Validierungsbericht.
#
# quality: original = Referenzgröße selbst | proxy = investierbarer Fonds/ETF |
#          synthetisch = aus anderen Reihen konstruiert
# verified: true erst, wenn `navigator data sources --probe` die Reihe live bestätigt hat.

calibration:
  window_months: 36      # Überlappungsfenster nach Proxy-Start
  min_months: 12         # darunter keine Kalibrierung (Backfill bleibt unverändert)
  shrinkage: 0.5         # Schrumpfung von alpha/beta Richtung (0, 1)
  min_correlation: 0.6   # darunter passt der Backfill zu schlecht: keine Kalibrierung, Warnung
  beta_bounds: [0.5, 2.0]
  alpha_bound_monthly: 0.0   # kein Niveauausgleich: aus 36 Monaten nicht belastbar schätzbar

assets:
  # ------------------------------------------------------------------ Aktien
  equity_us:
    name: Aktien USA
    group: Aktien
    role: Wachstum steigend
    fx_exposure: {USD: 1.0}
    segments:
      - id: vfinx
        kind: price
        quality: proxy
        currency: USD
        expected_start: "1976-08"
        symbols: {yfinance: VFINX, tiingo: VFINX, eodhd: VFINX.US}
        fallback_symbols: {yfinance: SPY, tiingo: SPY, eodhd: SPY.US}
      - id: french_us_market
        kind: returns
        quality: original
        backfill: true
        currency: USD
        expected_start: "1926-07"
        symbols: {static: "french_us_factors:Mkt-RF+RF"}

  equity_europe:
